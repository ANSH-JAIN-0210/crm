services:
  - type: keyvalue
    name: crm-redis
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: crm-web
    runtime: docker
    repo: https://github.com/ANSH-JAIN-0210/crm
    branch: main
    region: singapore
    plan: free
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: CRM_PROCESS
        value: all
      - key: NODE_ENV
        value: production
      - key: PG_DATABASE_URL
        sync: false
      - key: PG_POOL_MAX_CONNECTIONS
        value: "5"
      - key: REDIS_URL
        fromService:
          name: crm-redis
          type: keyvalue
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: STORAGE_TYPE
        value: s3
      - key: STORAGE_S3_NAME
        value: crm-files
      - key: STORAGE_S3_REGION
        sync: false
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: EMAIL_FROM_NAME
        value: crm
      - key: IS_BILLING_ENABLED
        value: "false"
      - key: IS_MULTIWORKSPACE_ENABLED
        value: "false"
